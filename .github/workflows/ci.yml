name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release -j 4
      - name: Unit tests
        # Decoder-dependent tests self-skip (exit 77); gates need the pinned
        # testdata and dav2d binary, which are not part of the repo.
        run: ctest --test-dir build-release -E '^gate_' --output-on-failure
      - name: Kernel gate (fixture-free)
        # Excluded from the -E above because it is itself named gate_*.
        run: ctest --test-dir build-release -R '^gate_primitives$' --output-on-failure
      - name: Codec unit gates (fixture-free)
        # The RDOQ trellis and transform-variant gates are pure unit tests, but
        # they are registered under the additive gate_ label like
        # gate_primitives, so they need the same explicit selection.  rdoq_test
        # caught the per-magnitude rate-cache regression that only the component
        # script had been running.
        run: >
          ctest --test-dir build-release
          -R '^gate_(rdoq|tx_variants)$' --output-on-failure
      - name: Build-seam check
        # Both configurations of every migrated TU; no testdata needed.
        run: bash tools/refactor/build_seam_check.sh
      - name: Glued-statement check
        # Catches a newline lost between a brace and its first statement: the
        # statements still compile, so nothing else notices.
        run: bash tools/refactor/check_glued_statements.sh
      - name: Synthetic smoke encode
        # Input is generated (ffmpeg or a Python Y4M writer), so this runs on
        # macOS too, where the runner ships no ffmpeg.
        run: bash tools/ci_encode_smoke.sh build-release/av2enc 8 8

  arm64:
    name: build + NEON kernel gate (ubuntu arm64, GCC)
    # The only job where kernels_neon.cpp is non-empty and compiled by GCC:
    # x86 covers nothing in that TU, and macOS uses clang, which accepts the
    # vector-type conversions GCC rejects.  PCH is off here so the job tests the
    # plain GCC path.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset release -DAV2ENC_PCH=OFF
      - name: Build
        run: cmake --build --preset release -j 4
      - name: Unit tests
        run: ctest --test-dir build-release -E '^gate_' --output-on-failure
      - name: NEON kernel gate
        # gate_primitives compares the NEON table against the scalar oracle.
        run: ctest --test-dir build-release -R '^gate_primitives$' --output-on-failure
      - name: Build-seam check
        run: bash tools/refactor/build_seam_check.sh
      - name: Synthetic smoke encode
        run: bash tools/ci_encode_smoke.sh build-release/av2enc 8 8

  sanitize:
    name: ASan + UBSan (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('src/**/*.cpp','src/**/*.h','CMakeLists.txt','tests/**/*.cpp') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang ccache
      - name: Configure
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DAV2ENC_ENABLE_CUDA=OFF -DAV2ENC_ALLOW_CPU_ONLY=ON \
            -DCMAKE_CXX_FLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan -j 4
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build-asan -E '^gate_' --output-on-failure
          ctest --test-dir build-asan -R '^gate_primitives$' --output-on-failure
      - name: Synthetic smoke encode
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash tools/ci_encode_smoke.sh build-asan/av2enc 8 8

  tsan:
    name: TSan, trace-enabled (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('src/**/*.cpp','src/**/*.h','CMakeLists.txt','tests/**/*.cpp') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang ccache
      - name: Configure
        run: |
          cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DAV2ENC_ENABLE_CUDA=OFF -DAV2ENC_ALLOW_CPU_ONLY=ON \
            -DCMAKE_CXX_FLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=thread" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build
        run: cmake --build build-tsan -j 4
      # --video-trace is the schedule that previously raced on std::cerr.
      - name: Synthetic trace encode
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: bash tools/ci_encode_smoke.sh build-tsan/av2enc 8 8 --trace

  fuzz:
    name: Y4M parser fuzzing (ubuntu, 120 s)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('src/**/*.cpp','src/**/*.h','CMakeLists.txt','tests/**/*.cpp') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang ccache
      - name: Configure
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DAV2ENC_ENABLE_CUDA=OFF -DAV2ENC_ALLOW_CPU_ONLY=ON \
            -DAV2ENC_FUZZ=ON
      - name: Build fuzz target
        run: cmake --build build-fuzz --target fuzz_y4m -j 4
      - name: Restore fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz the Y4M header parser
        run: |
          mkdir -p build-fuzz/corpus
          cp -n tests/fuzz_corpus/* build-fuzz/corpus/ 2>/dev/null || true
          build-fuzz/tests/fuzz_y4m build-fuzz/corpus \
            -max_total_time=120 -rss_limit_mb=2048 -print_final_stats=1
      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash
          path: |
            build-fuzz/crash-*
            build-fuzz/leak-*
            build-fuzz/timeout-*
          if-no-files-found: ignore
      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
